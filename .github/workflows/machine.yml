name: the machine

on:
  schedule:
    # 01 SCRAPE - weekly. The researcher's cost does not scale with output,
    # and the winners table is an asset that accumulates.
    - cron: '0 6 * * 1'
    # 02-04 - daily. Write, design and post from what 01 already found.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      stages:
        description: 'Comma-separated stages (research,write,design,post)'
        required: false
        default: 'write,design,post'
      dry_run:
        description: 'Rehearse without spending or publishing'
        type: boolean
        default: false

concurrency:
  group: machine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install ffmpeg
        # The apt build includes libfreetype, so drawtext is available and
        # captions are burned in. Skip it and the machine silently ships
        # caption-less shorts.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - run: npm test

      - name: Decide stages
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 6 * * 1" ]; then
              echo "stages=research" >> "$GITHUB_OUTPUT"
            else
              echo "stages=write,design,post" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "stages=${{ inputs.stages }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight
        id: preflight
        # Scheduled workflows go live the moment this lands on the default
        # branch, whether or not any credential has been added yet. Without
        # this gate every cron would fail and mail the owner daily, training
        # them to ignore exactly the notification that matters once the
        # machine is real. A dry run needs no credentials, so it always runs.
        env:
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_APIFY: ${{ secrets.APIFY_TOKEN != '' }}
          HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
          DRY_RUN_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          STAGES: ${{ steps.plan.outputs.stages }}
        run: |
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          missing=""
          case "$STAGES" in *research*) [ "$HAS_APIFY" = "true" ] || missing="$missing APIFY_TOKEN";; esac
          case "$STAGES" in *write*)    [ "$HAS_ANTHROPIC" = "true" ] || missing="$missing ANTHROPIC_API_KEY";; esac
          case "$STAGES" in *design*)   [ "$HAS_GEMINI" = "true" ] || missing="$missing GEMINI_API_KEY";; esac
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=The machine is not configured yet::Skipping '$STAGES' - missing secret(s):$missing. Add them in Settings > Secrets and variables > Actions, or run this workflow manually with dry_run to rehearse."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run
        if: steps.preflight.outputs.configured == 'true'
        env:
          # Defaults to the flat-file store so an unconfigured run degrades
          # instead of dying on a missing Airtable key. Set the STORE_DRIVER
          # repository variable to 'airtable' once the base exists.
          STORE_DRIVER: ${{ vars.STORE_DRIVER || 'json' }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'none' }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          TTS_VOICE_ID: ${{ vars.TTS_VOICE_ID }}
          PUBLISH_PROVIDER: ${{ vars.PUBLISH_PROVIDER || 'none' }}
          METRICOOL_USER_TOKEN: ${{ secrets.METRICOOL_USER_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          UNIPILE_API_KEY: ${{ secrets.UNIPILE_API_KEY }}
          UNIPILE_DSN: ${{ secrets.UNIPILE_DSN }}
          UNIPILE_ACCOUNT_INSTAGRAM: ${{ secrets.UNIPILE_ACCOUNT_INSTAGRAM }}
          UNIPILE_ACCOUNT_TIKTOK: ${{ secrets.UNIPILE_ACCOUNT_TIKTOK }}
          UNIPILE_ACCOUNT_YOUTUBE: ${{ secrets.UNIPILE_ACCOUNT_YOUTUBE }}
          PUBLISH_TIMEZONE: ${{ vars.PUBLISH_TIMEZONE || 'America/New_York' }}
        run: |
          node src/cli.js run \
            --stages=${{ steps.plan.outputs.stages }} \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Upload rendered shorts
        if: always() && steps.preflight.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
