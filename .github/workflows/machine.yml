name: the machine

on:
  schedule:
    # 01 SCRAPE - weekly. The researcher's cost does not scale with output,
    # and the winners table is an asset that accumulates.
    - cron: '0 6 * * 1'
    # 02-04 - daily. Write, design and post from what 01 already found.
    - cron: '0 7 * * *'
    # Drain - hourly, because slots land on the hour and Unipile has no
    # scheduling of its own. A no-op on Metricool, which owns its own
    # schedule, so the job exits immediately unless the provider needs it.
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      stages:
        description: 'Comma-separated stages (research,write,design,post)'
        required: false
        default: 'write,design,post'
      dry_run:
        description: 'Rehearse without spending or publishing'
        type: boolean
        default: false
      doctor:
        description: 'Only check credentials and tooling - no scraping, no generation, no spend'
        type: boolean
        default: false

concurrency:
  group: machine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Decide stages
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              '0 6 * * 1')  echo "stages=research" >> "$GITHUB_OUTPUT" ;;
              '30 * * * *') echo "stages=drain" >> "$GITHUB_OUTPUT" ;;
              *)            echo "stages=write,design,post" >> "$GITHUB_OUTPUT" ;;
            esac
          elif [ "${{ inputs.doctor }}" = "true" ]; then
            echo "stages=doctor" >> "$GITHUB_OUTPUT"
          else
            echo "stages=${{ inputs.stages }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the code before running it for real
        if: steps.plan.outputs.stages != 'drain' && steps.plan.outputs.stages != 'doctor'
        run: npm test

      - name: Install ffmpeg
        if: steps.plan.outputs.stages != 'drain'
        # Kept for `doctor` too: it reports on ffmpeg and the caption filter,
        # and that answer is only useful if it describes the environment a real run would get.
        # The apt build includes libfreetype, so drawtext is available and
        # captions are burned in. Skip it and the machine silently ships
        # caption-less shorts.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Preflight
        id: preflight
        # Scheduled workflows go live the moment this lands on the default
        # branch, whether or not any credential has been added yet. Without
        # this gate every cron would fail and mail the owner daily, training
        # them to ignore exactly the notification that matters once the
        # machine is real. A dry run needs no credentials, so it always runs.
        env:
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_APIFY: ${{ secrets.APIFY_TOKEN != '' }}
          HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
          COPY_PROVIDER: ${{ vars.COPY_PROVIDER || 'gemini' }}
          DRY_RUN_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          STAGES: ${{ steps.plan.outputs.stages }}
        run: |
          if [ "$DRY_RUN_INPUT" = "true" ] || [ "$STAGES" = "doctor" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          missing=""
          if [ "$STAGES" = "drain" ]; then
            # Only Unipile leaves anything to drain; Metricool schedules natively.
            if [ "${{ vars.PUBLISH_PROVIDER }}" = "unipile" ]; then
              echo "configured=true" >> "$GITHUB_OUTPUT"
            else
              echo "configured=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          case "$STAGES" in *research*) [ "$HAS_APIFY" = "true" ] || missing="$missing APIFY_TOKEN";; esac
          # Skill 02's key depends on which writer is configured. On the
          # default (gemini) it is the same key skill 03 already needs.
          case "$STAGES" in *write*)
            case "$COPY_PROVIDER" in
              gemini)            [ "$HAS_GEMINI" = "true" ]    || missing="$missing GEMINI_API_KEY" ;;
              openai-compatible) [ "$HAS_OPENAI" = "true" ]    || missing="$missing OPENAI_API_KEY" ;;
              anthropic)         [ "$HAS_ANTHROPIC" = "true" ] || missing="$missing ANTHROPIC_API_KEY" ;;
              *) missing="$missing a-valid-COPY_PROVIDER" ;;
            esac ;;
          esac
          case "$STAGES" in *design*)   [ "$HAS_GEMINI" = "true" ] || missing="$missing GEMINI_API_KEY";; esac
          # Both write and design can want the same key; say it once.
          missing=$(echo "$missing" | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/^ *//;s/ *$//')
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=The machine is not configured yet::Skipping '$STAGES' - missing secret(s): $missing. Add them in Settings > Secrets and variables > Actions, or run this workflow manually with dry_run to rehearse."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run
        if: steps.preflight.outputs.configured == 'true'
        env:
          # Defaults to the flat-file store so an unconfigured run degrades
          # instead of dying on a missing Airtable key. Set the STORE_DRIVER
          # repository variable to 'airtable' once the base exists.
          STORE_DRIVER: ${{ vars.STORE_DRIVER || 'json' }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          COPY_PROVIDER: ${{ vars.COPY_PROVIDER || 'gemini' }}
          COPY_MODEL: ${{ vars.COPY_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'none' }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          TTS_VOICE_ID: ${{ vars.TTS_VOICE_ID }}
          PUBLISH_PROVIDER: ${{ vars.PUBLISH_PROVIDER || 'none' }}
          METRICOOL_USER_TOKEN: ${{ secrets.METRICOOL_USER_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          UNIPILE_API_KEY: ${{ secrets.UNIPILE_API_KEY }}
          UNIPILE_DSN: ${{ secrets.UNIPILE_DSN }}
          UNIPILE_ACCOUNT_INSTAGRAM: ${{ secrets.UNIPILE_ACCOUNT_INSTAGRAM }}
          UNIPILE_ACCOUNT_TIKTOK: ${{ secrets.UNIPILE_ACCOUNT_TIKTOK }}
          UNIPILE_ACCOUNT_YOUTUBE: ${{ secrets.UNIPILE_ACCOUNT_YOUTUBE }}
          PUBLISH_TIMEZONE: ${{ vars.PUBLISH_TIMEZONE || 'America/New_York' }}
        run: |
          if [ "${{ steps.plan.outputs.stages }}" = "doctor" ]; then
            # Read-only: reports which credentials this runner can actually see.
            # Its non-zero exit means "something is missing", which is the
            # answer being asked for, not a broken run - so the job stays green
            # and the report itself is the deliverable.
            node src/cli.js doctor | tee /tmp/doctor.txt || true
            {
              echo '## Credential and tooling check'
              echo
              echo '```'
              sed 's/\x1b\[[0-9;]*m//g' /tmp/doctor.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.plan.outputs.stages }}" = "drain" ]; then
            node src/cli.js drain
          else
            node src/cli.js run \
              --stages=${{ steps.plan.outputs.stages }} \
              ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
          fi

      - name: Upload rendered shorts
        if: always() && steps.preflight.outputs.configured == 'true' && steps.plan.outputs.stages != 'doctor'
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
