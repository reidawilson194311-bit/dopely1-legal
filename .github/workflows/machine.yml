name: the machine

on:
  schedule:
    # 01 SCRAPE - weekly. The researcher's cost does not scale with output,
    # and the winners table is an asset that accumulates.
    - cron: '0 6 * * 1'
    # 02-04 - daily. Write, design and post from what 01 already found.
    - cron: '0 7 * * *'
    # Drain - hourly, because slots land on the hour and Unipile has no
    # scheduling of its own. A no-op on Metricool, which owns its own
    # schedule, so the job exits immediately unless the provider needs it.
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      stages:
        description: 'Comma-separated stages (research,news,write,design,post)'
        required: false
        default: 'write,design,post'
      dry_run:
        description: 'Rehearse without spending or publishing'
        type: boolean
        default: false
      doctor:
        description: 'Only check credentials and tooling - no scraping, no generation, no spend'
        type: boolean
        default: false
      voiceover:
        description: 'Narrate this run with Gemini TTS (overrides TTS_PROVIDER for this run only)'
        type: boolean
        default: false
      requeue:
        description: 'Move rows between statuses (defaults: scripts, designed -> ready-to-design)'
        type: boolean
        default: false
      requeue_table:
        description: 'Which table to requeue: scripts | winners | renders | posts'
        type: string
        required: false
      requeue_from:
        description: 'Status to move rows OUT of'
        type: string
        required: false
      requeue_to:
        description: 'Status to move rows IN to'
        type: string
        required: false
      show:
        description: 'Print the latest rows in full for review - reads only, generates nothing'
        type: boolean
        default: false
      show_table:
        description: 'Which table to show: scripts | winners | renders | posts'
        type: string
        required: false
      patch_id:
        description: 'Correct one field on one row: the row id (also sets stages=patch)'
        type: string
        required: false
      patch_field:
        description: 'Field to set, e.g. status or beats.3.onScreenText'
        type: string
        required: false
      patch_value:
        description: 'New value'
        type: string
        required: false
      patch_table:
        description: 'Table the row is in (default scripts)'
        type: string
        required: false
      setup_airtable:
        description: 'Build the Airtable base (safe to re-run; never deletes or retypes a field)'
        type: boolean
        default: false
      seedance:
        description: 'Generate one 5s Seedance 2.5 test video (BILLABLE - makes a real generation request)'
        type: boolean
        default: false
      probe_higgsfield:
        description: 'Ask the Higgsfield API which submit path exists, and follow one generation'
        type: boolean
        default: false
      probe_submagic:
        description: 'Ask the Submagic API which endpoints exist (read-only; publishes nothing)'
        type: boolean
        default: false
      probe_project_id:
        description: 'A Submagic project id, so the probe can check per-project paths'
        type: string
        required: false
      probe_publish_post:
        description: 'Also POST an empty body to /publish - cannot publish, only asks if the route exists'
        type: boolean
        default: false

concurrency:
  group: machine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Rendered videos are uploaded as release assets so publishers that
      # fetch by URL can reach them. Without this the upload 403s whenever the
      # repository's default token permission is read-only.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Decide stages
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              '0 6 * * 1')  echo "stages=research" >> "$GITHUB_OUTPUT" ;;
              '30 * * * *') echo "stages=drain" >> "$GITHUB_OUTPUT" ;;
              *)            echo "stages=news,write,design,post" >> "$GITHUB_OUTPUT" ;;
            esac
          elif [ "${{ inputs.seedance }}" = "true" ]; then
            echo "stages=seedance" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.probe_higgsfield }}" = "true" ]; then
            echo "stages=probe-higgsfield" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.probe_submagic }}" = "true" ]; then
            echo "stages=probe-submagic" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.setup_airtable }}" = "true" ]; then
            echo "stages=setup-airtable" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.patch_id }}" ]; then
            echo "stages=patch" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.requeue }}" = "true" ]; then
            echo "stages=requeue" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.show }}" = "true" ]; then
            echo "stages=show" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.doctor }}" = "true" ]; then
            echo "stages=doctor" >> "$GITHUB_OUTPUT"
          else
            echo "stages=${{ inputs.stages }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the code before running it for real
        if: >-
          steps.plan.outputs.stages != 'drain' &&
          steps.plan.outputs.stages != 'doctor' &&
          steps.plan.outputs.stages != 'setup-airtable' &&
          steps.plan.outputs.stages != 'probe-submagic' &&
          steps.plan.outputs.stages != 'probe-higgsfield' &&
          steps.plan.outputs.stages != 'seedance' &&
          steps.plan.outputs.stages != 'show' &&
          steps.plan.outputs.stages != 'requeue' &&
          steps.plan.outputs.stages != 'patch'
        run: npm test

      - name: Install ffmpeg
        if: >-
          steps.plan.outputs.stages != 'drain' &&
          steps.plan.outputs.stages != 'setup-airtable' &&
          steps.plan.outputs.stages != 'probe-submagic' &&
          steps.plan.outputs.stages != 'probe-higgsfield' &&
          steps.plan.outputs.stages != 'seedance' &&
          steps.plan.outputs.stages != 'show' &&
          steps.plan.outputs.stages != 'requeue' &&
          steps.plan.outputs.stages != 'patch'
        # Kept for `doctor` too: it reports on ffmpeg and the caption filter,
        # and that answer is only useful if it describes the environment a real run would get.
        # The apt build includes libfreetype, so drawtext is available and
        # captions are burned in. Skip it and the machine silently ships
        # caption-less shorts.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Preflight
        id: preflight
        # Scheduled workflows go live the moment this lands on the default
        # branch, whether or not any credential has been added yet. Without
        # this gate every cron would fail and mail the owner daily, training
        # them to ignore exactly the notification that matters once the
        # machine is real. A dry run needs no credentials, so it always runs.
        env:
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_APIFY: ${{ secrets.APIFY_TOKEN != '' }}
          HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
          # This one keeps a fallback: the step below branches on the value in
          # shell, so it needs a literal. It must stay equal to config.js's
          # default for COPY_PROVIDER, or preflight checks a different provider
          # than the run uses.
          COPY_PROVIDER: ${{ vars.COPY_PROVIDER || 'gemini' }}
          DRY_RUN_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          STAGES: ${{ steps.plan.outputs.stages }}
        run: |
          if [ "$DRY_RUN_INPUT" = "true" ] || [ "$STAGES" = "doctor" ] || \
             [ "$STAGES" = "setup-airtable" ] || [ "$STAGES" = "probe-submagic" ] || \
             [ "$STAGES" = "probe-higgsfield" ] || [ "$STAGES" = "seedance" ] || \
             [ "$STAGES" = "show" ] || [ "$STAGES" = "requeue" ] || \
             [ "$STAGES" = "patch" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          missing=""
          if [ "$STAGES" = "drain" ]; then
            # Only Unipile leaves anything to drain; Metricool schedules natively.
            if [ "${{ vars.PUBLISH_PROVIDER }}" = "unipile" ]; then
              echo "configured=true" >> "$GITHUB_OUTPUT"
            else
              echo "configured=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          case "$STAGES" in *research*) [ "$HAS_APIFY" = "true" ] || missing="$missing APIFY_TOKEN";; esac
          # Skill 02's key depends on which writer is configured. On the
          # default (gemini) it is the same key skill 03 already needs.
          case "$STAGES" in *write*)
            case "$COPY_PROVIDER" in
              gemini)            [ "$HAS_GEMINI" = "true" ]    || missing="$missing GEMINI_API_KEY" ;;
              openai-compatible) [ "$HAS_OPENAI" = "true" ]    || missing="$missing OPENAI_API_KEY" ;;
              anthropic)         [ "$HAS_ANTHROPIC" = "true" ] || missing="$missing ANTHROPIC_API_KEY" ;;
              *) missing="$missing a-valid-COPY_PROVIDER" ;;
            esac ;;
          esac
          case "$STAGES" in *design*)   [ "$HAS_GEMINI" = "true" ] || missing="$missing GEMINI_API_KEY";; esac
          # Both write and design can want the same key; say it once.
          missing=$(echo "$missing" | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/^ *//;s/ *$//')
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=The machine is not configured yet::Skipping '$STAGES' - missing secret(s): $missing. Add them in Settings > Secrets and variables > Actions, or run this workflow manually with dry_run to rehearse."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run
        if: steps.preflight.outputs.configured == 'true'
        env:
          # Defaults to the flat-file store so an unconfigured run degrades
          # instead of dying on a missing Airtable key. Set the STORE_DRIVER
          # repository variable to 'airtable' once the base exists.
          STORE_DRIVER: ${{ vars.STORE_DRIVER || 'json' }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          SUBMAGIC_API_KEY: ${{ secrets.SUBMAGIC_API_KEY }}
          # Checked before the run, not after. Three separate batches have been
          # destroyed by a field the code writes and the base does not have:
          # Airtable rejects the WHOLE row for one unknown column, so the
          # failure lands after the images, the narration and the video have
          # all been paid for. The check costs one request.
          FAIL_ON_SCHEMA_DRIFT: '1'
          SUBMAGIC_LANGUAGE: ${{ vars.SUBMAGIC_LANGUAGE }}
          SUBMAGIC_TIKTOK_PRIVACY: ${{ vars.SUBMAGIC_TIKTOK_PRIVACY }}
          # Hosting the rendered video so Submagic can fetch it by URL.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SUBMAGIC_PROBE_PROJECT_ID: ${{ inputs.probe_project_id }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          COPY_PROVIDER: ${{ vars.COPY_PROVIDER }}
          COPY_MODEL: ${{ vars.COPY_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # No `|| 'none'` here. A fallback in this file is a SECOND default that
          # silently beats the one in config.js: the variable is always set, so
          # config's own default never applies. That is how a render that was
          # meant to narrate came out silent after the default was changed.
          # Pass the variable through and let config.js decide - it reads an
          # empty value as absent.
          TTS_PROVIDER: ${{ inputs.voiceover && 'gemini' || vars.TTS_PROVIDER }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          TTS_VOICE_ID: ${{ vars.TTS_VOICE_ID }}
          TTS_MODEL: ${{ vars.TTS_MODEL }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER }}
          HIGGSFIELD_KEY_ID: ${{ secrets.HIGGSFIELD_KEY_ID }}
          HIGGSFIELD_KEY_SECRET: ${{ secrets.HIGGSFIELD_KEY_SECRET }}
          HIGGSFIELD_IMAGE_MODEL: ${{ vars.HIGGSFIELD_IMAGE_MODEL }}
          HF_CREDENTIALS: ${{ secrets.HF_CREDENTIALS }}
          PUBLISH_PROVIDER: ${{ vars.PUBLISH_PROVIDER }}
          METRICOOL_USER_TOKEN: ${{ secrets.METRICOOL_USER_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          UNIPILE_API_KEY: ${{ secrets.UNIPILE_API_KEY }}
          UNIPILE_DSN: ${{ secrets.UNIPILE_DSN }}
          UNIPILE_ACCOUNT_INSTAGRAM: ${{ secrets.UNIPILE_ACCOUNT_INSTAGRAM }}
          UNIPILE_ACCOUNT_TIKTOK: ${{ secrets.UNIPILE_ACCOUNT_TIKTOK }}
          UNIPILE_ACCOUNT_YOUTUBE: ${{ secrets.UNIPILE_ACCOUNT_YOUTUBE }}
          PUBLISH_TIMEZONE: ${{ vars.PUBLISH_TIMEZONE || 'America/New_York' }}
        run: |
          if [ "${{ steps.plan.outputs.stages }}" = "seedance" ]; then
            # index.ts reads HF_CREDENTIALS from the environment, so no
            # .env.local is needed here - the secret never touches the disk.
            node index.ts | tee /tmp/seedance.txt || true
            {
              echo '## Seedance 2.5 test generation'
              echo
              echo '```'
              sed 's/\x1b\[[0-9;]*m//g' /tmp/seedance.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.plan.outputs.stages }}" = "probe-higgsfield" ]; then
            node scripts/probe-higgsfield.js | tee /tmp/hf.txt || true
            {
              echo '## Higgsfield API probe'
              echo
              echo '```'
              sed 's/\x1b\[[0-9;]*m//g' /tmp/hf.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.plan.outputs.stages }}" = "probe-submagic" ]; then
            # Read-only: GETs only, so nothing can be published by accident.
            node scripts/probe-submagic.js \
              ${{ inputs.probe_publish_post && '--post-publish' || '' }} \
              | tee /tmp/probe.txt || true
            {
              echo '## Submagic API probe'
              echo
              echo '```'
              sed 's/\x1b\[[0-9;]*m//g' /tmp/probe.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.plan.outputs.stages }}" = "setup-airtable" ]; then
            # Builds the base's tables and fields. Idempotent, and it never
            # deletes or retypes an existing field, so re-running is safe.
            node scripts/setup-airtable.js | tee /tmp/airtable.txt
            {
              echo '## Airtable base setup'
              echo
              echo '```'
              sed 's/\x1b\[[0-9;]*m//g' /tmp/airtable.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.plan.outputs.stages }}" = "requeue" ]; then
            node src/cli.js requeue --limit=25 \
              ${{ inputs.requeue_table && format('--table={0}', inputs.requeue_table) || '' }} \
              ${{ inputs.requeue_from && format('--from={0}', inputs.requeue_from) || '' }} \
              ${{ inputs.requeue_to && format('--to={0}', inputs.requeue_to) || '' }} \
              | tee /tmp/requeue.txt
            {
              echo '## Requeued'
              echo
              echo '```'
              sed 's/\x1b\[[0-9;]*m//g' /tmp/requeue.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.plan.outputs.stages }}" = "patch" ]; then
            node src/cli.js patch \
              --id='${{ inputs.patch_id }}' \
              --field='${{ inputs.patch_field }}' \
              --value='${{ inputs.patch_value }}' \
              ${{ inputs.patch_table && format('--table={0}', inputs.patch_table) || '' }} \
              | tee /tmp/patch.txt
            {
              echo '## Patched'
              echo
              echo '```'
              sed 's/\x1b\[[0-9;]*m//g' /tmp/patch.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.plan.outputs.stages }}" = "show" ]; then
            # Reads the store and prints it. No model calls, no spend.
            node src/cli.js show --limit=10 \
              ${{ inputs.show_table && format('--table={0}', inputs.show_table) || '' }} \
              | tee /tmp/show.txt
            {
              echo '## The batch'
              echo
              echo '```'
              sed 's/\x1b\[[0-9;]*m//g' /tmp/show.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.plan.outputs.stages }}" = "doctor" ]; then
            # Read-only: reports which credentials this runner can actually see.
            # Its non-zero exit means "something is missing", which is the
            # answer being asked for, not a broken run - so the job stays green
            # and the report itself is the deliverable.
            node src/cli.js doctor | tee /tmp/doctor.txt || true
            {
              echo '## Credential and tooling check'
              echo
              echo '```'
              sed 's/\x1b\[[0-9;]*m//g' /tmp/doctor.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.plan.outputs.stages }}" = "drain" ]; then
            node src/cli.js drain
          else
            node src/cli.js run \
              --stages=${{ steps.plan.outputs.stages }} \
              ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
          fi

      - name: Upload rendered shorts
        if: >-
          always() && steps.preflight.outputs.configured == 'true' &&
          steps.plan.outputs.stages != 'doctor' &&
          steps.plan.outputs.stages != 'setup-airtable' &&
          steps.plan.outputs.stages != 'probe-submagic' &&
          steps.plan.outputs.stages != 'probe-higgsfield' &&
          steps.plan.outputs.stages != 'seedance' &&
          steps.plan.outputs.stages != 'show' &&
          steps.plan.outputs.stages != 'requeue' &&
          steps.plan.outputs.stages != 'patch'
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
