name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately separate from machine.yml: that workflow runs the real
    # pipeline with credentials, which must never fire on a pull request.
    # This one only proves the code is sound - no secrets, no network, no spend.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Every test is a pure function - no ffmpeg, no API keys, no fixtures on
      # disk - so there is nothing else to install.
      - run: npm test
